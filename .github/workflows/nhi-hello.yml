name: NHI hello world

on:
  workflow_dispatch:

# id-token: write is what makes GitHub mint OIDC tokens for this job.
# Without it the token-request endpoint returns 403.
permissions:
  id-token: write
  contents: read

jobs:
  hello-nhi:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Mint an OIDC token with the audience generated by Privilege when the
      # NHI was registered. vars.NHI_AUDIENCE is a repo variable (the audience
      # is an identity binding, not a secret).
      - name: Get Procyon NHI token
        id: token
        env:
          AUDIENCE: ${{ vars.NHI_AUDIENCE }}
        run: |
          set -euo pipefail
          if [ -z "$AUDIENCE" ]; then
            echo "::error::repo variable NHI_AUDIENCE is not set for ${GITHUB_REPOSITORY}. Add it under Settings → Secrets and variables → Actions → Variables tab (not Secrets, not environment scope)."
            exit 1
          fi
          # note: verified against the NHI registered for techwor/stratus-site
          echo "NHI_AUDIENCE resolved (length: ${#AUDIENCE})"
          TOKEN=$(curl -sS -f \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE}" \
            | jq -r '.value')
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "::error::GitHub did not return an OIDC token. Check that the job has permission id-token: write."
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      # Print the claims Privilege will verify against the registered NHI:
      #   iss: https://token.actions.githubusercontent.com
      #   sub: repo:techwor/stratus-site:ref:refs/heads/main
      #   aud: <the NHI audience>
      - name: Show token claims
        env:
          TOKEN: ${{ steps.token.outputs.token }}
        run: |
          python3 -c '
          import base64, json, os
          payload = __import__("os").environ["TOKEN"].split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          print("JWT claims as Privilege will see them:")
          print(json.dumps({k: claims[k] for k in ("sub", "aud", "iss") if k in claims}, indent=2))
          '

      - name: Hello world
        env:
          TOKEN: ${{ steps.token.outputs.token }}
        run: |
          SUB=$(python3 -c '
          import base64, json, os
          payload = os.environ["TOKEN"].split(".")[1]
          payload += "=" * (-len(payload) % 4)
          print(json.loads(base64.urlsafe_b64decode(payload))["sub"])
          ')
          echo "Hello world from ${{ github.repository }}!"
          echo "Authenticated as Procyon NHI with subject: $SUB"

      # When the app exposes an NHI-protected endpoint, this is the call shape:
      # - name: Call the controller with the NHI token
      #   env:
      #     TOKEN: ${{ steps.token.outputs.token }}
      #   run: |
      #     curl -sS -H "Authorization: Bearer $TOKEN" \
      #       https://<controller-host>/<api-path>
