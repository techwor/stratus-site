<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00b87a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00a0c8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cloud" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#c7e0ff;stop-opacity:0.9" />
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Glow ring -->
  <rect width="64" height="64" rx="14" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
  <!-- Cloud shape -->
  <path d="M46 33a8 8 0 0 0-7.4-8A10 10 0 0 0 19 30a6 6 0 0 0 1 12h26a5 5 0 0 0 0-9z"
        fill="url(#cloud)"/>
  <!-- Network nodes below cloud -->
  <circle cx="22" cy="50" r="3.5" fill="rgba(255,255,255,0.85)"/>
  <circle cx="32" cy="50" r="3.5" fill="rgba(255,255,255,0.85)"/>
  <circle cx="42" cy="50" r="3.5" fill="rgba(255,255,255,0.85)"/>
  <!-- Connector lines -->
  <line x1="22" y1="46" x2="22" y2="42" stroke="rgba(255,255,255,0.5)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="32" y1="46" x2="32" y2="42" stroke="rgba(255,255,255,0.5)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="42" y1="46" x2="42" y2="42" stroke="rgba(255,255,255,0.5)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="22" y1="50" x2="42" y2="50" stroke="rgba(255,255,255,0.3)" stroke-width="1" stroke-linecap="round"/>
</svg>
